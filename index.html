<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wafic Mikati</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
        --line: #cbd5e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(120% 80% at 50% -20%, #e2e8f0 0%, var(--bg) 48%);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 24px;
      }

      h1 {
        margin: 0;
        text-align: center;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      h1 a {
        color: inherit;
        text-decoration: none;
        font-size: inherit;
        font-weight: inherit;
        letter-spacing: inherit;
        padding: 0;
        border: 0;
        transition: color 140ms ease;
      }

      h1 a:hover {
        color: var(--muted);
      }

      nav {
        display: flex;
        margin-top: 30px;
      }

      nav a {
        color: var(--text);
        text-decoration: none;
        font-size: 1.05rem;
        display: inline-block;
        padding: 10px 0 4px;
        border-bottom: 1px solid var(--line);
        transition: color 140ms ease, border-color 140ms ease;
      }

      nav a:hover {
        color: var(--muted);
        border-color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <a href="https://github.com/waficmikati" target="_blank" rel="noreferrer">Wafic Mikati</a>
      </h1>
      <nav>
        <a href="./mermaid/">Mermaid Editor</a>
      </nav>
    </main>
  </body>
</html>
